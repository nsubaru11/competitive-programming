[project]
name = "competitive-programming"
version = "0.1.0"
description = "Python environment for solutions"
# AtCoder の CPython に合わせる
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
# AtCoder の 2025-10 言語アップデートと同じバージョン
contest = [
    "bitarray==3.6.1",
    "gmpy2==2.2.1",
    "more-itertools==10.7.0",
    "mpmath==1.3.0",
    "networkx==3.5",
    "numpy==2.2.6",
    "scipy==1.16.1",
    "sortedcontainers==2.4.0",
    "sympy==1.14.0",
]

[tool.uv]
package = false
default-groups = ["contest"]
